services:
  mysql:
    image: mysql:8.0.29
    container_name: mysql-8.0.29
    restart: "no"

    command: mysqld --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: rest_with_spring_boot_erudio

    ports:
      - "3306:3306"

    volumes:
      - mysql80-data:/var/lib/mysql

volumes:
  mysql80-data:
