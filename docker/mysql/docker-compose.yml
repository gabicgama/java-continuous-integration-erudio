services:

    mysql:
        image: mysql:8.4
        container_name: mysql
        restart: "no"

        environment:
            MYSQL_ROOT_PASSWORD: 123456
            MYSQL_DATABASE: db_default
            MYSQL_USER: spring
            MYSQL_PASSWORD: 123456

        ports:
            - "3306:3306"

        volumes:
            - mysql-data:/var/lib/mysql

volumes:
    mysql-data:
